<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendataan Penarikan PIP 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
    }

    /* Layar Loading */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 50%, #eef2ff 100%);
      transition: opacity 0.45s ease, visibility 0.45s ease;
      padding: 24px;
      text-align: center;
    }

    #loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 24px;
      padding: 36px 32px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Animasi Spinner Ganda */
    .spinner-wrap {
      position: relative;
      width: 56px;
      height: 56px;
      margin-bottom: 20px;
    }

    .spinner-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3.5px solid #e2e8f0;
      border-top-color: #2563eb;
      animation: spin 0.9s linear infinite;
    }

    .spinner-inner {
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-bottom-color: #4f46e5;
      animation: spin-reverse 1.2s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      to { transform: rotate(-360deg); }
    }

    .loader-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #2563eb;
      background: #dbeafe;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .loader-title {
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .loader-sub {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    /* Bar Animasi Indeterminate */
    .progress-track {
      width: 100%;
      height: 4px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 20px;
    }

    .progress-bar {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #4f46e5);
      border-radius: 999px;
      animation: slide 1.4s ease-in-out infinite;
    }

    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(250%); }
    }

    /* Iframe Full Screen */
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    iframe.loaded {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Overlay Loading -->
  <div id="loader">
    <div class="loader-card">
      <div class="spinner-wrap">
        <div class="spinner-outer"></div>
        <div class="spinner-inner"></div>
      </div>
      <span class="loader-badge">Sistem Pendataan</span>
      <h2 class="loader-title">Pendataan PIP 2026</h2>
      <p class="loader-sub">Sedang menyiapkan formulir dan menghubungkan ke server...</p>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- Iframe Utama -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyWMFaY9LXmedQSbaDGgHFnBTlOzyS7fEIaMtr74M9ay5aAtTwq4lAi4zukoE7XAIRv/exec"
    allow="camera; microphone; display-capture"
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      const frame = document.getElementById('appFrame');
      
      frame.classList.add('loaded');
      setTimeout(() => {
        loader.classList.add('fade-out');
      }, 250);
    }

    // Fallback pengaman jika koneksi lambat (hilangkan loader maksimal setelah 12 detik)
    setTimeout(hideLoader, 12000);
  </script>

</body>
</html>
